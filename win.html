<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Победители конкурса TransPhoto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .winners {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .winner {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 300px;
        }
        .winner img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .winner-info {
            padding: 15px;
        }
        .winner-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .winner-city {
            color: #2c3e50;
            font-weight: bold;
        }
        .winner-vehicle {
            color: #2c3e50;
        }
        .winner-author {
            color: #555;
            margin-bottom: 5px;
        }
        .winner-votes {
            color: #e74c3c;
            font-weight: bold;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Последние победители конкурса TransPhoto</h1>
    
    <div class="winners" id="winnersContainer">
        <div class="loading">Загрузка данных...</div>
    </div>
    
    <button class="refresh-btn" id="refreshBtn">Обновить</button>

    <script>
        const PROXY_URL = "https://api.allorigins.win/raw?url=";
        const TARGET_URL = "https://transphoto.org/voting.php?show=results";

        async function fetchPhotoDetails(photoUrl) {
            try {
                const response = await fetch(PROXY_URL + encodeURIComponent(photoUrl));
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                
                // Извлекаем название города и транспорта
                const titleElement = doc.querySelector('h1');
                let fullTitle = titleElement?.textContent?.trim() || 'Город не указан, Транспортное средство не указано';
                
                // Разделяем город и транспортное средство
                let [cityName, vehicleName] = fullTitle.split(',').map(s => s.trim());
                if (!vehicleName) {
                    vehicleName = 'Транспортное средство не указано';
                }
                
                // Извлекаем имя автора
                let authorName = 'Неизвестен';
                let authorUrl = '#';
                const authorLink = doc.querySelector('a[href^="/author/"]');
                if (authorLink) {
                    authorName = authorLink.textContent.trim();
                    const authorId = authorLink.getAttribute('href').split('/')[2];
                    authorUrl = `https://transphoto.org/author/${authorId}/`;
                }
                
                // Извлекаем количество голосов
                const votesLabel = Array.from(doc.querySelectorAll('td'))
                    .find(el => el.textContent.includes('Голосов:'));
                const votes = votesLabel?.nextElementSibling?.textContent?.trim() || 'N/A';
                
                return { 
                    cityName: cityName || 'Город не указан',
                    vehicleName: vehicleName,
                    authorName: authorName,
                    authorUrl: authorUrl,
                    votes: votes.replace(/\s+/g, ' ').trim()
                };
            } catch (error) {
                console.error('Ошибка при загрузке деталей фото:', error);
                return { 
                    cityName: 'Город не указан',
                    vehicleName: 'Транспортное средство не указано',
                    authorName: 'Неизвестен',
                    authorUrl: '#',
                    votes: 'N/A'
                };
            }
        }

        async function fetchWinners() {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = '<div class="loading">Загрузка данных...</div>';
            
            try {
                const response = await fetch(PROXY_URL + encodeURIComponent(TARGET_URL));
                const html = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                
                const photoLinks = Array.from(doc.querySelectorAll("a[href^='/photo/']"))
                    .filter(a => a.querySelector('img'))
                    .slice(0, 3);
                
                if (photoLinks.length === 0) {
                    throw new Error("Не найдены фотографии победителей");
                }
                
                const winnersPromises = photoLinks.map(async link => {
                    const photoId = link.getAttribute('href').match(/\/photo\/(\d+)/)[1];
                    const firstPart = photoId.substring(0, 2);
                    const secondPart = photoId.substring(2, 4);
                    const thirdPart = photoId.substring(4, 6);
                    const imageUrl = `https://transphoto.org/photo/${firstPart}/${secondPart}/${thirdPart}/${photoId}.jpg`;
                    const photoPageUrl = `https://transphoto.org${link.getAttribute('href')}`;
                    
                    const details = await fetchPhotoDetails(photoPageUrl);
                    
                    return {
                        imageUrl: imageUrl,
                        cityName: details.cityName,
                        vehicleName: details.vehicleName,
                        authorName: details.authorName,
                        authorUrl: details.authorUrl,
                        votes: details.votes,
                        link: photoPageUrl
                    };
                });
                
                const winners = await Promise.all(winnersPromises);
                renderWinners(winners);
            } catch (error) {
                console.error("Ошибка:", error);
                container.innerHTML = `<div class="error">Ошибка загрузки данных: ${error.message}</div>`;
            }
        }

        function renderWinners(winners) {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = "";
            
            winners.forEach(winner => {
                const winnerEl = document.createElement("div");
                winnerEl.className = "winner";
                winnerEl.innerHTML = `
                    <a href="${winner.link}" target="_blank">
                        <img src="${winner.imageUrl}" alt="${winner.cityName}, ${winner.vehicleName}" onerror="this.src='https://transphoto.org/images/nophoto.png'">
                    </a>
                    <div class="winner-info">
                        <div class="winner-title">
                            <span class="winner-city">${winner.cityName}</span>, 
                            <span class="winner-vehicle">${winner.vehicleName}</span>
                        </div>
                        <div class="winner-author">
                            Автор: <a href="${winner.authorUrl}" target="_blank">${winner.authorName}</a>
                        </div>
                        <div class="winner-votes">Голосов: ${winner.votes}</div>
                    </div>
                `;
                container.appendChild(winnerEl);
            });
        }

        document.addEventListener("DOMContentLoaded", fetchWinners);
        document.getElementById("refreshBtn").addEventListener("click", fetchWinners);
    </script>
</body>
</html>
