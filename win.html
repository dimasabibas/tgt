<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Победители конкурса TransPhoto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .winners {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .winner {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 300px;
        }
        .winner img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .winner-info {
            padding: 15px;
        }
        .winner-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .winner-author {
            color: #555;
        }
        .winner-votes {
            color: #e74c3c;
            font-weight: bold;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Последние победители конкурса TransPhoto</h1>
    
    <div class="winners" id="winnersContainer">
        <div class="loading">Загрузка данных...</div>
    </div>
    
    <button class="refresh-btn" id="refreshBtn">Обновить</button>

    <script>
        // Используем прокси для обхода CORS (для демо)
        const PROXY_URL = "https://cors-anywhere.herokuapp.com/";
        const TARGET_URL = "https://transphoto.org/voting.php?show=results";

        async function fetchWinners() {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = '<div class="loading">Загрузка данных...</div>';
            
            try {
                const response = await fetch(PROXY_URL + TARGET_URL);
                const html = await response.text();
                
                // Парсим HTML с помощью DOMParser
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                
                // Находим таблицу с результатами
                const table = doc.querySelector(".voting_results");
                if (!table) throw new Error("Не найдены результаты голосования");
                
                // Извлекаем топ-3 фото
                const rows = table.querySelectorAll("tr:not(:first-child)");
                const winners = [];
                
                for (let i = 0; i < Math.min(3, rows.length); i++) {
                    const row = rows[i];
                    const img = row.querySelector("img");
                    const link = row.querySelector("a");
                    const votes = row.querySelector("td:nth-child(3)");
                    
                    if (!img || !link || !votes) continue;
                    
                    winners.push({
                        imageUrl: img.src,
                        title: link.textContent.trim(),
                        author: row.querySelector("td:nth-child(2)").textContent.trim(),
                        votes: votes.textContent.trim(),
                        link: link.href
                    });
                }
                
                // Отрисовываем победителей
                renderWinners(winners);
            } catch (error) {
                console.error("Ошибка:", error);
                container.innerHTML = `<div class="error">Ошибка загрузки данных. Попробуйте позже.</div>`;
            }
        }

        function renderWinners(winners) {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = "";
            
            if (winners.length === 0) {
                container.innerHTML = `<div class="error">Нет данных о победителях</div>`;
                return;
            }
            
            winners.forEach(winner => {
                const winnerEl = document.createElement("div");
                winnerEl.className = "winner";
                winnerEl.innerHTML = `
                    <a href="${winner.link}" target="_blank">
                        <img src="${winner.imageUrl}" alt="${winner.title}">
                    </a>
                    <div class="winner-info">
                        <div class="winner-title">${winner.title}</div>
                        <div class="winner-author">Автор: ${winner.author}</div>
                        <div class="winner-votes">Голосов: ${winner.votes}</div>
                    </div>
                `;
                container.appendChild(winnerEl);
            });
        }

        // Загружаем данные при старте
        document.addEventListener("DOMContentLoaded", fetchWinners);
        
        // Обновляем по кнопке
        document.getElementById("refreshBtn").addEventListener("click", fetchWinners);
    </script>
</body>
</html>
