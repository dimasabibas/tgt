<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Победители конкурса TransPhoto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .winners {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .winner {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 300px;
        }
        .winner img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .winner-info {
            padding: 15px;
        }
        .winner-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .winner-author {
            color: #555;
        }
        .winner-votes {
            color: #e74c3c;
            font-weight: bold;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Последние победители конкурса TransPhoto</h1>
    
    <div class="winners" id="winnersContainer">
        <div class="loading">Загрузка данных...</div>
    </div>
    
    <button class="refresh-btn" id="refreshBtn">Обновить</button>

    <script>
        // Используем прокси для обхода CORS (может потребоваться активация)
        const PROXY_URL = "https://api.allorigins.win/raw?url=";
        const TARGET_URL = "https://transphoto.org/voting.php?show=results";

        async function fetchWinners() {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = '<div class="loading">Загрузка данных...</div>';
            
            try {
                const response = await fetch(PROXY_URL + encodeURIComponent(TARGET_URL));
                const html = await response.text();
                
                // Парсим HTML с помощью DOMParser
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                
                // Находим все ссылки на фотографии в таблице результатов
                const photoLinks = Array.from(doc.querySelectorAll("a[href^='/photo/']"))
                    .filter(a => a.querySelector('img'))
                    .slice(0, 3); // Берем первые 3 фото
                
                if (photoLinks.length === 0) {
                    throw new Error("Не найдены фотографии победителей");
                }
                
                const winners = photoLinks.map(link => {
                    const img = link.querySelector('img');
                    const row = link.closest('tr');
                    const votes = row?.querySelector('td:nth-child(3)')?.textContent?.trim() || 'N/A';
                    const author = row?.querySelector('td:nth-child(2)')?.textContent?.trim() || 'Неизвестен';
                    
                    return {
                        imageUrl: img.src.startsWith('http') ? img.src : `https://transphoto.org${img.src}`,
                        title: img.alt || 'Фотография транспорта',
                        author: author,
                        votes: votes,
                        link: `https://transphoto.org${link.getAttribute('href')}`
                    };
                });
                
                // Отрисовываем победителей
                renderWinners(winners);
            } catch (error) {
                console.error("Ошибка:", error);
                container.innerHTML = `<div class="error">Ошибка загрузки данных: ${error.message}</div>`;
            }
        }

        function renderWinners(winners) {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = "";
            
            winners.forEach(winner => {
                const winnerEl = document.createElement("div");
                winnerEl.className = "winner";
                winnerEl.innerHTML = `
                    <a href="${winner.link}" target="_blank">
                        <img src="${winner.imageUrl}" alt="${winner.title}">
                    </a>
                    <div class="winner-info">
                        <div class="winner-title">${winner.title}</div>
                        <div class="winner-author">Автор: ${winner.author}</div>
                        <div class="winner-votes">Голосов: ${winner.votes}</div>
                    </div>
                `;
                container.appendChild(winnerEl);
            });
        }

        // Загружаем данные при старте
        document.addEventListener("DOMContentLoaded", fetchWinners);
        
        // Обновляем по кнопке
        document.getElementById("refreshBtn").addEventListener("click", fetchWinners);
    </script>
</body>
</html>
