<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Победители конкурса TransPhoto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .winners {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .winner {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 300px;
        }
        .winner img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .winner-info {
            padding: 15px;
        }
        .winner-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .winner-author {
            color: #555;
        }
        .winner-votes {
            color: #e74c3c;
            font-weight: bold;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Последние победители конкурса TransPhoto</h1>
    
    <div class="winners" id="winnersContainer">
        <div class="loading">Загрузка данных...</div>
    </div>
    
    <button class="refresh-btn" id="refreshBtn">Обновить</button>

    <script>
        // Альтернативный прокси-сервер
        const PROXY_URL = "https://corsproxy.io/?"; 
        const TARGET_URL = "https://transphoto.org/voting.php?show=results";

        async function fetchWinners() {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = '<div class="loading">Загрузка данных...</div>';
            
            try {
                // Загружаем страницу через прокси
                const response = await fetch(PROXY_URL + encodeURIComponent(TARGET_URL));
                const html = await response.text();
                
                // Создаем временный элемент для парсинга
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                
                // Находим все миниатюры фотографий
                const thumbnails = tempDiv.querySelectorAll('a[href^="/photo/"] img[src^="/photos/"]');
                const winners = [];
                
                // Обрабатываем первые 3 фото
                for (let i = 0; i < Math.min(3, thumbnails.length); i++) {
                    const img = thumbnails[i];
                    const link = img.closest('a');
                    const row = img.closest('tr');
                    
                    // Получаем ID фото из ссылки
                    const photoId = link.getAttribute('href').split('/')[2];
                    
                    // Формируем URL полноразмерного изображения
                    const imgUrl = `https://transphoto.org/photo/${photoId.substring(0,2)}/${photoId.substring(2,4)}/${photoId.substring(4,6)}/${photoId}.jpg`;
                    
                    // Получаем дополнительные данные
                    const author = row?.querySelector('td:nth-child(2)')?.textContent?.trim() || 'Неизвестен';
                    const votes = row?.querySelector('td:nth-child(3)')?.textContent?.trim() || 'N/A';
                    
                    winners.push({
                        imageUrl: imgUrl,
                        title: img.alt || 'Фотография транспорта',
                        author: author,
                        votes: votes,
                        link: `https://transphoto.org${link.getAttribute('href')}`
                    });
                }
                
                if (winners.length === 0) {
                    throw new Error("Не найдены фотографии победителей");
                }
                
                renderWinners(winners);
            } catch (error) {
                console.error("Ошибка:", error);
                container.innerHTML = `<div class="error">Ошибка загрузки данных. Попробуйте обновить страницу или зайти позже.</div>`;
            }
        }

        function renderWinners(winners) {
            const container = document.getElementById("winnersContainer");
            container.innerHTML = "";
            
            winners.forEach(winner => {
                const winnerEl = document.createElement("div");
                winnerEl.className = "winner";
                winnerEl.innerHTML = `
                    <a href="${winner.link}" target="_blank">
                        <img src="${winner.imageUrl}" alt="${winner.title}" 
                             onerror="this.onerror=null;this.src='https://via.placeholder.com/300x200?text=Фото+не+доступно'">
                    </a>
                    <div class="winner-info">
                        <div class="winner-title">${winner.title}</div>
                        <div class="winner-author">Автор: ${winner.author}</div>
                        <div class="winner-votes">Голосов: ${winner.votes}</div>
                    </div>
                `;
                container.appendChild(winnerEl);
            });
        }

        // Загружаем данные при старте
        document.addEventListener("DOMContentLoaded", fetchWinners);
        
        // Обновляем по кнопке
        document.getElementById("refreshBtn").addEventListener("click", fetchWinners);
    </script>
</body>
</html>
